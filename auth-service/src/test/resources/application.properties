spring.application.name=auth-service-test
spring.datasource.url=jdbc:h2:mem:auth_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=
app.secret=dGhpc2lzYXZlcnlzZWN1cmVqd3RzZWNyZXRrZXkxMjM0NTY3ODkwMTI=
app.expiration=3600000
spring.kafka.bootstrap-servers=localhost:9092
kafka.topics.patient-created=patient-created.v1
kafka.topics.user-provisioned=user-provisioned.v1
kafka.groups.auth-patient-provisioning=auth-patient-provisioning-group
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
