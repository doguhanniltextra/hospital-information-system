spring.profiles.active=test
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
grpc.server.port=9090

# Database test config (H2 in memory)
spring.datasource.write.url=jdbc:h2:mem:patient_write_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.write.driver-class-name=org.h2.Driver
spring.datasource.write.username=sa
spring.datasource.write.password=

spring.datasource.read.url=jdbc:h2:mem:patient_read_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.read.driver-class-name=org.h2.Driver
spring.datasource.read.username=sa
spring.datasource.read.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=

spring.kafka.bootstrap-servers=localhost:9092
kafka.topics.lab-result-completed=lab-result-completed.v1
kafka.groups.patient-lab-result=patient-lab-result-group
kafka.topics.user-provisioned=user-provisioned.v1
kafka.groups.patient-auth-link=patient-auth-link-group
kafka.topics.patient-created=patient-created.v1

