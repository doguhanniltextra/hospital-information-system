spring.profiles.active=default

server.port=${SERVER_PORT:8080}

# =============================================================================
# Kubernetes Readiness, Liveness & Graceful Shutdown
# =============================================================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=framework

management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# =============================================================================
# gRPC Server Configuration (Inter-service queries)
# =============================================================================
grpc.server.port=${GRPC_SERVER_PORT:9090}

# =============================================================================
# Database configuration (Dual DataSource - CQRS)
# =============================================================================
# Write Database
spring.datasource.write.url=${PATIENT_WRITE_DB_URL:jdbc:postgresql://patient-write-db:5432/patient_db?currentSchema=patient_schema}
spring.datasource.write.username=${SPRING_DATASOURCE_USERNAME:patient_user}
spring.datasource.write.password=${SPRING_DATASOURCE_PASSWORD:patient_pass_123}
spring.datasource.write.driver-class-name=org.postgresql.Driver

# Read Database
spring.datasource.read.url=${PATIENT_READ_DB_URL:jdbc:postgresql://patient-read-db:5432/patient_db?currentSchema=patient_schema}
spring.datasource.read.username=${SPRING_DATASOURCE_USERNAME:patient_user}
spring.datasource.read.password=${SPRING_DATASOURCE_PASSWORD:patient_pass_123}
spring.datasource.read.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.default_schema=patient_schema
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================================================
# HikariCP Connection Pool
# =============================================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=0

# =============================================================================
# Kafka Configuration
# =============================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

kafka.topics.lab-result-completed=${KAFKA_TOPIC_LAB_RESULT_COMPLETED:lab-result-completed.v1}
kafka.groups.patient-lab-result=${KAFKA_GROUP_PATIENT_LAB_RESULT:patient-lab-result-group}
kafka.topics.user-provisioned=user-provisioned.v1
kafka.groups.patient-auth-link=patient-auth-link-group
kafka.topics.patient-created=patient-created.v1

# =============================================================================
# Actuator / Prometheus Metrics
# =============================================================================
management.tracing.sampling.probability=1.0
spring.kafka.producer.observation-enabled=true
spring.kafka.listener.observation-enabled=true
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=patient-management

# =============================================================================
# Resilience4j — Circuit Breaker & Retry
# =============================================================================
resilience4j.circuitbreaker.instances.kafkaProducer.sliding-window-size=10
resilience4j.circuitbreaker.instances.kafkaProducer.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafkaProducer.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.kafkaProducer.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.kafkaProducer.minimum-number-of-calls=5

resilience4j.retry.instances.kafkaProducer.max-attempts=3
resilience4j.retry.instances.kafkaProducer.wait-duration=1s

# =============================================================================
# Security & PII Encryption
# =============================================================================
app.security.encryption-key=${APP_SECURITY_ENCRYPTION_KEY:${ENCRYPTION_KEY}}
app.secret=${APP_SECRET}