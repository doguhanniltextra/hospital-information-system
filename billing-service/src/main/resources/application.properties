server.port=${SERVER_PORT:8081}

# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Database Configuration (PostgreSQL CQRS Dual DataSource)
# Standard Fallback DataSource
spring.datasource.url=${SPRING_DATASOURCE_WRITE_JDBC_URL:${SPRING_DATASOURCE_WRITE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/billing_db?currentSchema=billing_schema}}}
spring.datasource.username=${SPRING_DATASOURCE_WRITE_USERNAME:${SPRING_DATASOURCE_USERNAME:billing_user}}
spring.datasource.password=${SPRING_DATASOURCE_WRITE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:billing_pass_123}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Write Database
spring.datasource.write.jdbc-url=${SPRING_DATASOURCE_WRITE_JDBC_URL:${SPRING_DATASOURCE_WRITE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/billing_db?currentSchema=billing_schema}}}
spring.datasource.write.url=${SPRING_DATASOURCE_WRITE_JDBC_URL:${SPRING_DATASOURCE_WRITE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/billing_db?currentSchema=billing_schema}}}
spring.datasource.write.username=${SPRING_DATASOURCE_WRITE_USERNAME:${SPRING_DATASOURCE_USERNAME:billing_user}}
spring.datasource.write.password=${SPRING_DATASOURCE_WRITE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:billing_pass_123}}
spring.datasource.write.driver-class-name=org.postgresql.Driver

# Read Database
spring.datasource.read.jdbc-url=${SPRING_DATASOURCE_READ_JDBC_URL:${SPRING_DATASOURCE_READ_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/billing_db?currentSchema=billing_schema}}}
spring.datasource.read.url=${SPRING_DATASOURCE_READ_JDBC_URL:${SPRING_DATASOURCE_READ_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/billing_db?currentSchema=billing_schema}}}
spring.datasource.read.username=${SPRING_DATASOURCE_READ_USERNAME:${SPRING_DATASOURCE_USERNAME:billing_user}}
spring.datasource.read.password=${SPRING_DATASOURCE_READ_PASSWORD:${SPRING_DATASOURCE_PASSWORD:billing_pass_123}}
spring.datasource.read.driver-class-name=org.postgresql.Driver

# Hibernate & JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.default_schema=billing_schema
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=0

# gRPC
grpc.server.port=9001
logging.pattern.console=%-5level %logger{36} - %msg%n
spring.output.ansi.enabled=ALWAYS

# External APIs
invoice.api.key=${INVOICE_API_KEY:mock_invoice_api_key}
invoice.api.url=${INVOICE_API_URL:https://invoice-generator.com}
claim.api.url=${CLAIM_API_URL:https://httpbin.org/status/200}
claims.retry.fixed-delay-ms=${CLAIMS_RETRY_FIXED_DELAY_MS:300000}

# Resilience4j - Claim Provider
resilience4j.circuitbreaker.instances.claimProvider.sliding-window-size=10
resilience4j.circuitbreaker.instances.claimProvider.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.claimProvider.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.claimProvider.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.claimProvider.minimum-number-of-calls=5

# Tracing & Observation
management.tracing.sampling.probability=1.0
spring.kafka.producer.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# Actuator & Probes
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=billing-service

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
kafka.topics.appointment-payment-updated=${KAFKA_TOPIC_APPOINTMENT_PAYMENT_UPDATED:appointment-payment-updates.v1}
kafka.groups.appointment=${KAFKA_GROUP_APPOINTMENT:appointment-group}
kafka.topics.lab-order-placed=${KAFKA_TOPIC_LAB_ORDER_PLACED:lab-order-placed.v1}
kafka.groups.billing-lab-order=${KAFKA_GROUP_BILLING_LAB_ORDER:billing-lab-order-group}
kafka.topics.inventory-item-consumed=${KAFKA_TOPIC_INVENTORY_ITEM_CONSUMED:inventory-item-consumed.v1}
kafka.topics.admission-bed-charge=${KAFKA_TOPIC_ADMISSION_BED_CHARGE:admission-bed-charge.v1}
kafka.topics.admission-discharged=${KAFKA_TOPIC_ADMISSION_DISCHARGED:admission-discharged.v1}

# Storage
app.invoice.storage.path=${APP_INVOICE_STORAGE_PATH:/tmp/invoices}
