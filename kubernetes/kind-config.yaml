kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: his-local

nodes:
  # 1. Control-Plane Node
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            image-gc-high-threshold: "85"
            image-gc-low-threshold: "80"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  # 2. Worker Node 1
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            eviction-hard: "memory.available<300Mi,nodefs.available<5%"
            image-gc-high-threshold: "85"
            image-gc-low-threshold: "80"

  # 3. Worker Node 2
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            eviction-hard: "memory.available<300Mi,nodefs.available<5%"
            image-gc-high-threshold: "85"
            image-gc-low-threshold: "80"

networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
