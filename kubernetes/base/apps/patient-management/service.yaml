apiVersion: v1
kind: Service
metadata:
  name: patient-management
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: patient-management
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
