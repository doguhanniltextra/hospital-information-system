apiVersion: v1
kind: ConfigMap
metadata:
  name: admission-service-config
  labels:
    app.kubernetes.io/name: admission-service
    app.kubernetes.io/instance: admission-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: hospital-information-system
    app.kubernetes.io/managed-by: kustomize
data:
  SERVER_PORT: "8086"
  SPRING_DATASOURCE_WRITE_JDBC_URL: "jdbc:postgresql://postgres:5432/admission_db?currentSchema=admission_schema"
  SPRING_DATASOURCE_READ_JDBC_URL: "jdbc:postgresql://postgres:5432/admission_db?currentSchema=admission_schema"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  PATIENT_SERVICE_GRPC_HOST: "patient-management"
  PATIENT_SERVICE_GRPC_PORT: "9090"
  DOCTOR_SERVICE_GRPC_HOST: "doctor-service"
  DOCTOR_SERVICE_GRPC_PORT: "9005"
