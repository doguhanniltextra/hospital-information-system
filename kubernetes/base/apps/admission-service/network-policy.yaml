apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admission-service-netpol
  labels:
    app.kubernetes.io/name: admission-service
    app.kubernetes.io/instance: admission-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: hospital-information-system
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: admission-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from API Gateway
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - protocol: TCP
          port: 8086
  egress:
    # Allow DNS (UDP & TCP)
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow gRPC to Patient Management (9090) and Doctor Service (9005)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: patient-management
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: doctor-service
      ports:
        - protocol: TCP
          port: 9005
    # Allow PostgreSQL, Kafka, Redis, and Vault
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 8200
