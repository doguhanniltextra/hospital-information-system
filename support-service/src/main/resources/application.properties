spring.application.name=support-service
server.port=${SERVER_PORT:8085}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Database Configuration (PostgreSQL CQRS Dual DataSource)
# Standard Fallback DataSource
spring.datasource.url=${SPRING_DATASOURCE_WRITE_JDBC_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/support_db?currentSchema=support_schema}}
spring.datasource.username=${SPRING_DATASOURCE_WRITE_USERNAME:${SPRING_DATASOURCE_USERNAME:support_user}}
spring.datasource.password=${SPRING_DATASOURCE_WRITE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:support_pass_123}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Write Side
spring.datasource.write.jdbc-url=${SPRING_DATASOURCE_WRITE_JDBC_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/support_db?currentSchema=support_schema}}
spring.datasource.write.url=${SPRING_DATASOURCE_WRITE_JDBC_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/support_db?currentSchema=support_schema}}
spring.datasource.write.username=${SPRING_DATASOURCE_WRITE_USERNAME:${SPRING_DATASOURCE_USERNAME:support_user}}
spring.datasource.write.password=${SPRING_DATASOURCE_WRITE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:support_pass_123}}
spring.datasource.write.driver-class-name=org.postgresql.Driver

# Read Side
spring.datasource.read.jdbc-url=${SPRING_DATASOURCE_READ_JDBC_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/support_db?currentSchema=support_schema}}
spring.datasource.read.url=${SPRING_DATASOURCE_READ_JDBC_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/support_db?currentSchema=support_schema}}
spring.datasource.read.username=${SPRING_DATASOURCE_READ_USERNAME:${SPRING_DATASOURCE_USERNAME:support_user}}
spring.datasource.read.password=${SPRING_DATASOURCE_READ_PASSWORD:${SPRING_DATASOURCE_PASSWORD:support_pass_123}}
spring.datasource.read.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=support_schema
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Security
app.secret=${APP_SECRET:mySecretKeyForJwtTokenWhichMustBeAtLeast256BitsLong}
internal.service.token=${INTERNAL_SERVICE_TOKEN:pm-internal-token}

# Redis Configuration (Cache Side)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:redis}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
spring.cache.type=redis

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=support-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
metrics.recording.level=OFF

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator & Probes & Monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=support-service
management.tracing.sampling.probability=1.0

# Tracing
spring.kafka.producer.observation-enabled=true
spring.kafka.listener.observation-enabled=true
