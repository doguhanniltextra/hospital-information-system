spring.application.name=admission-service
server.port=${SERVER_PORT:8086}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Database configuration (CQRS Dual DataSource / Consolidated PostgreSQL)
# Write Database
spring.datasource.write.url=${SPRING_DATASOURCE_WRITE_JDBC_URL:${ADMISSION_WRITE_DB_URL:jdbc:postgresql://postgres:5432/admission_db?currentSchema=admission_schema}}
spring.datasource.write.username=${SPRING_DATASOURCE_WRITE_USERNAME:${SPRING_DATASOURCE_USERNAME:admission_user}}
spring.datasource.write.password=${SPRING_DATASOURCE_WRITE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:admission_pass_123}}
spring.datasource.write.driver-class-name=org.postgresql.Driver

# Read Database
spring.datasource.read.url=${SPRING_DATASOURCE_READ_JDBC_URL:${ADMISSION_READ_DB_URL:jdbc:postgresql://postgres:5432/admission_db?currentSchema=admission_schema}}
spring.datasource.read.username=${SPRING_DATASOURCE_READ_USERNAME:${SPRING_DATASOURCE_USERNAME:admission_user}}
spring.datasource.read.password=${SPRING_DATASOURCE_READ_PASSWORD:${SPRING_DATASOURCE_PASSWORD:admission_pass_123}}
spring.datasource.read.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# Explicitly set the default schema for Hibernate to find tables in admission_schema
spring.jpa.properties.hibernate.default_schema=admission_schema
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=admission-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
metrics.recording.level=OFF

# Service Security
app.secret=${APP_SECRET:mySecretKeyForJwtTokenWhichMustBeAtLeast256BitsLong}
internal.service.token=${INTERNAL_SERVICE_TOKEN:pm-internal-token}

# API documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator / Prometheus / Probes
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=admission-service

# Tracing & Observation
management.tracing.sampling.probability=1.0
spring.kafka.producer.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# Redis & Caching
spring.cache.type=redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:redis}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}

# GRPC Clients
grpc.client.patient-service.address=static://${PATIENT_SERVICE_GRPC_HOST:patient-management}:${PATIENT_SERVICE_GRPC_PORT:9090}
grpc.client.patient-service.negotiation-type=plaintext

grpc.client.doctor-service.address=static://${DOCTOR_SERVICE_GRPC_HOST:doctor-service}:${DOCTOR_SERVICE_GRPC_PORT:9005}
grpc.client.doctor-service.negotiation-type=plaintext

# Kafka Topics
kafka.topic.admission-bed-charge=admission-bed-charge.v1
kafka.topic.admission-discharged=admission-discharged.v1
