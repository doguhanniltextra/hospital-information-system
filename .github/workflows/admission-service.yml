name: Admission Service - DevSecOps CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'admission-service/**'
      - 'kubernetes/base/apps/admission-service/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'admission-service/**'
      - 'kubernetes/base/apps/admission-service/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admission-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service_name: "admission-service"
      service_path: "admission-service"
      image_name: "doguhannilt/admission-service"
      k8s_overlay_path: "kubernetes/overlays/prod"
    secrets: inherit
