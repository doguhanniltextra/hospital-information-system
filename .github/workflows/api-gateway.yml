name: API Gateway - DevSecOps CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'api-gateway/**'
      - 'kubernetes/base/apps/api-gateway/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'api-gateway/**'
      - 'kubernetes/base/apps/api-gateway/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service_name: "api-gateway"
      service_path: "api-gateway"
      image_name: "doguhannilt/api-gateway"
      k8s_overlay_path: "kubernetes/overlays/prod"
    secrets: inherit
